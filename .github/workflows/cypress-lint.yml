name: Cypress Tests Lint & Format Check

on:
  pull_request:
    paths:
      - 'Dfe.ManageFreeSchoolProjects/Dfe.ManageFreeSchoolProjects.CypressTests/**'

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Dfe.ManageFreeSchoolProjects/Dfe.ManageFreeSchoolProjects.CypressTests

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: 'Dfe.ManageFreeSchoolProjects/Dfe.ManageFreeSchoolProjects.CypressTests/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'Dfe.ManageFreeSchoolProjects/Dfe.ManageFreeSchoolProjects.CypressTests/package-lock.json'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting and lint
        run: npm run format:check
